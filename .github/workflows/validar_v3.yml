name: Validar arquitectura v3 y corte IA preliminar
on:
  push:
    branches: [main]
    paths:
      - 'db/estructura_v3.sql'
      - 'scripts/*_v3.py'
      - 'data/ia_v3/**'
      - '.github/workflows/validar_v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validacion_integral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas de Norma 00 y base v3
        run: |
          python scripts/probar_estructura_v3.py
          python scripts/probar_construccion_v3.py
          python scripts/probar_exportacion_v3.py
          python scripts/probar_control_ia_v3.py
          python scripts/probar_registro_ia_v3.py
          python scripts/probar_fuentes_pdf_v3.py
      - name: Construcción limpia desde captura de IA
        run: python scripts/construir_base_v3.py --salida salidas/convocatorias_v3.sqlite
      - name: Exportación de contrato v3
        run: python scripts/exportar_base_v3.py --db salidas/convocatorias_v3.sqlite --salida salidas/expedientes_v3.json
      - name: Guardar artefactos para revisión
        uses: actions/upload-artifact@v4
        with:
          name: base-v3-ia-preliminar-96
          path: |
            salidas/convocatorias_v3.sqlite
            salidas/expedientes_v3.json
          if-no-files-found: error
