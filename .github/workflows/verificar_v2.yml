name: Validar estructura, comparador y protocolo IA
on:
  push:
    branches: [main]
    paths:
      - 'db/estructura_v2.sql'
      - 'docs/NORMA-04-validacion-convocatorias.md'
      - 'scripts/probar_validacion_convocatorias.py'
      - 'scripts/probar_estructura_v2.py'
      - 'comparador-v2.html'
      - 'data/lotes/**'
      - 'data/exportacion_v2.json'
      - 'scripts/importar_excel_v2.py'
      - 'scripts/generar_publicacion_v2.py'
      - 'scripts/probar_comparador_v2.py'
      - 'config/operacion_ia.json'
      - 'scripts/validar_lote_ia.py'
      - 'scripts/probar_control_lotes_ia.py'
      - 'tests/fixtures/lote_ia_ejemplo.json'
      - '.github/workflows/verificar_v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar que originales y sintéticos están separados
        run: python scripts/probar_estructura_v2.py
      - name: Verificar puertas de validacion por convocatoria y enlaces de evidencia
        run: python scripts/probar_validacion_convocatorias.py
      - name: Verificar exportación reproducible desde la base v2
        run: python scripts/generar_publicacion_v2.py --comprobar
      - name: Verificar sintaxis, Excel y PDFs originales en Pages
        run: python scripts/probar_comparador_v2.py
      - name: Controlar lotes IA, orden, límite de 50 y lecturas repetidas
        run: python scripts/probar_control_lotes_ia.py
