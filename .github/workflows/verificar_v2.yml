name: Validar arquitectura v2
on:
  push:
    branches: [main]
    paths:
      - 'db/estructura_v2.sql'
      - 'scripts/probar_estructura_v2.py'
      - 'comparador-v2.html'
      - 'scripts/probar_comparador_v2.py'
      - 'scripts/extraer_pdf_v2.py'
      - 'scripts/probar_extraccion_v2.py'
      - '.github/workflows/verificar_v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arquitectura_v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar integridad y separación originales-sintéticos
        run: python scripts/probar_estructura_v2.py
